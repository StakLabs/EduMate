<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduMate - Notebook</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">
  <aside class="sidebar">
    <div class="sidebar-top">
      <h2 class="logo">EduMate</h2>
      <button class="add-source-btn" onclick="document.getElementById('fileInput').click()">
        <span>+</span> Add source
      </button>
      <input type="file" id="fileInput" hidden onchange="uploadFiles()" />
    </div>
    <div class="sources-section">
      <p class="section-label">Sources</p>
      <div id="fileList" class="file-list"></div>
    </div>
  </aside>

  <main class="canvas">
    <div class="canvas-paper">
      <header class="canvas-header">
        <h1 id="activeDocTitle">Workspace</h1>
      </header>
      <article id="sourceDisplay" class="canvas-content"></article>
    </div>
  </main>

  <section class="chat-pane">
    <div class="chat-header"><span>AI Chat</span></div>
    <div id="chatBox" class="chat-messages"></div>

    <div class="chat-input-area">
      <div class="input-pill">
        <div class="tools-container">
          <button class="tools-btn" onclick="toggleTools()">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.5 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z" fill="currentColor"></path></svg>
          </button>
          <div id="toolsMenu" class="tools-menu">
            <button onclick="runTool('quiz')">Convert to Quiz</button>
            <button onclick="runTool('summary')">Generate Summary</button>
            <button onclick="runTool('studyplan')">Create Study Plan</button>
          </div>
        </div>
        <textarea id="userInput" placeholder="Ask a question..." rows="1"></textarea>
        <button id="sendBtn" class="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"></path></svg>
        </button>
      </div>
    </div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
